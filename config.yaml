# Jev triage — local demo config (no secrets)
model: jev-latest
# Prefer TypeSafe Python SDK until AI_GATEWAY_API_KEY is present
backend: typesafe  # typesafe | gateway | dry
thresholds:
  min_confidence: 0.55   # below → needs_review
  # Acceptance targets (eval reports)
  auto_queue_accuracy_min: 0.80
  false_auto_max: 0.05
queues:
  - billing
  - account_access
  - product_bug
  - shipping
  - general
  - abuse
