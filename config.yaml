# Jev triage — local demo config (no secrets)
model: jev-latest
# TypeSafe only (Gateway abandoned 2026-09-21)
backend: typesafe  # typesafe | dry  (gateway abandoned)
thresholds:
  min_confidence: 0.85   # below → needs_review (raised to cut false-auto)
  # Acceptance targets (eval reports)
  auto_queue_accuracy_min: 0.80
  false_auto_max: 0.05
queues:
  - billing
  - account_access
  - product_bug
  - shipping
  - general
  - abuse
