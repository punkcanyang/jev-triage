<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Jev triage — ticket/email to six queues with confidence</title>
  <desc id="desc">Hero with six queue pills and live TypeSafe eval numbers on n=220 samples.</desc>
  <rect width="1200" height="380" rx="28" fill="#10141C"/>
  <circle cx="1100" cy="60" r="100" fill="#FFB020" opacity="0.08"/>
  <circle cx="1040" cy="300" r="80" fill="#4CC9F0" opacity="0.08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <text x="56" y="70" fill="#A0A8B8" font-size="16" letter-spacing="2">TYPESAFE JEV · CLASSIFY ONLY</text>
    <text x="56" y="136" fill="#F5F7FA" font-size="56" font-weight="700">Jev triage</text>
    <text x="56" y="182" fill="#D0D6E0" font-size="22">邮件／工单 → 六队列 JSON</text>
    <text x="56" y="218" fill="#A0A8B8" font-size="17">只分流，不代写回复，不收买家 LLM Key · Gateway 已放弃</text>

    <g transform="translate(56 250)">
      <rect width="110" height="28" rx="8" fill="#1A2030" stroke="#FFB020"/>
      <text x="55" y="19" text-anchor="middle" fill="#FFB020" font-size="12">billing</text>
      <rect x="120" width="130" height="28" rx="8" fill="#1A2030" stroke="#4CC9F0"/>
      <text x="185" y="19" text-anchor="middle" fill="#4CC9F0" font-size="12">account_access</text>
      <rect x="260" width="120" height="28" rx="8" fill="#1A2030" stroke="#F5F7FA"/>
      <text x="320" y="19" text-anchor="middle" fill="#F5F7FA" font-size="12">product_bug</text>
      <rect x="56" y="40" width="100" height="28" rx="8" fill="#1A2030" stroke="#A0A8B8"/>
      <text x="106" y="59" text-anchor="middle" fill="#A0A8B8" font-size="12">shipping</text>
      <rect x="166" y="40" width="90" height="28" rx="8" fill="#1A2030" stroke="#A0A8B8"/>
      <text x="211" y="59" text-anchor="middle" fill="#A0A8B8" font-size="12">general</text>
      <rect x="266" y="40" width="80" height="28" rx="8" fill="#1A2030" stroke="#FF6B6B"/>
      <text x="306" y="59" text-anchor="middle" fill="#FF6B6B" font-size="12">abuse</text>
    </g>
  </g>

  <!-- proof card -->
  <g transform="translate(720 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <rect width="424" height="268" rx="16" fill="#1A2030" stroke="#2A3348"/>
    <text x="24" y="40" fill="#A0A8B8" font-size="14" letter-spacing="1">LIVE TYPESAFE · n=220</text>
    <text x="24" y="92" fill="#F5F7FA" font-size="42" font-weight="700">88.2%</text>
    <text x="200" y="92" fill="#A0A8B8" font-size="16">overall queue</text>
    <text x="200" y="114" fill="#A0A8B8" font-size="14">194 / 220</text>
    <line x1="24" y1="140" x2="400" y2="140" stroke="#2A3348"/>
    <text x="24" y="176" fill="#4CC9F0" font-size="28" font-weight="700">99.2%</text>
    <text x="160" y="176" fill="#D0D6E0" font-size="15">auto-queue accuracy</text>
    <text x="24" y="214" fill="#3DDC97" font-size="28" font-weight="700">0.0%</text>
    <text x="140" y="214" fill="#D0D6E0" font-size="15">false-auto (target ≤5%)</text>
    <text x="24" y="248" fill="#A0A8B8" font-size="13">reports/eval-typesafe-live-full.md</text>
  </g>
</svg>
