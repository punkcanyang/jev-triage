<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Jev triage output JSON shape</title>
  <desc id="d">Example classify JSON with queue, urgency, refund, escalate, confidence, needs_review.</desc>
  <rect width="1200" height="280" rx="24" fill="#10141C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="44" fill="#A0A8B8" font-size="14" letter-spacing="1.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">OUTPUT SHAPE</text>
    <rect x="56" y="64" width="1088" height="180" rx="14" fill="#1A2030" stroke="#2A3348"/>
    <text x="80" y="100" fill="#A0A8B8" font-size="16">{</text>
    <text x="104" y="124" fill="#4CC9F0" font-size="16">"queue"</text>
    <text x="200" y="124" fill="#A0A8B8" font-size="16">:</text>
    <text x="220" y="124" fill="#FFB020" font-size="16">"billing"</text>
    <text x="104" y="148" fill="#4CC9F0" font-size="16">"urgency"</text>
    <text x="220" y="148" fill="#F5F7FA" font-size="16">0.72</text>
    <text x="104" y="172" fill="#4CC9F0" font-size="16">"refund"</text>
    <text x="220" y="172" fill="#F5F7FA" font-size="16">{ "bool": true, "confidence": 0.9 }</text>
    <text x="104" y="196" fill="#4CC9F0" font-size="16">"confidence"</text>
    <text x="260" y="196" fill="#F5F7FA" font-size="16">0.81</text>
    <text x="360" y="196" fill="#4CC9F0" font-size="16">"needs_review"</text>
    <text x="520" y="196" fill="#3DDC97" font-size="16">false</text>
    <text x="80" y="220" fill="#A0A8B8" font-size="16">}</text>
  </g>
</svg>
